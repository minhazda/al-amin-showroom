<style>
  :root { --ink:#16202b; --mute:#5b6875; --line:#d9dfe6; --bg:#f2f4f7; --card:#ffffff; --brand:#12355b; --go:#0b7a43; --warn:#b45309; --bad:#b42318; --soft:#e8eef6; --copper:#a0522d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body { font-family: "Noto Sans Bengali","Hind Siliguri","SolaimanLipi","Kalpurush","Nirmala UI","Vrinda",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:17px; line-height:1.4; }
  button { font:inherit; color:inherit; border:0; background:none; padding:0; margin:0; cursor:pointer; text-align:inherit; }

  #app { max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:96px; }
  body.wide #app { max-width:1100px; }
  .bar { position:sticky; top:0; z-index:5; background:var(--brand); color:#fff; display:flex; align-items:center; gap:8px; padding:10px 12px; min-height:56px; }
  .bar .back { width:44px; height:44px; border-radius:22px; font-size:30px; line-height:40px; text-align:center; background:rgba(255,255,255,.14); flex:none; }
  .bar .ttl { flex:1; font-size:20px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .who { font-size:14px; background:rgba(255,255,255,.16); border-radius:16px; padding:6px 10px; flex:none; max-width:40%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pad { padding:12px; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
  .grid3 { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
  .tile { min-width:0; overflow-wrap:anywhere; }
  @media (min-width:520px) { .grid3 { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
  body.wide .grid { grid-template-columns:repeat(4, minmax(0, 1fr)); } body.wide .grid3 { grid-template-columns:repeat(6, minmax(0, 1fr)); }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 8px; min-height:104px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; font-weight:700; }
  .tile .ic { font-size:38px; line-height:1; }
  .tile.sm { min-height:76px; padding:10px 6px; font-size:16px; }
  .tile.sm .ic { font-size:28px; }
  .tile.on { border:3px solid var(--go); background:#eaf7ef; }
  .tile.warn { border-color:var(--warn); background:#fff7ed; }
  .tile img, .tile svg.pic { width:92px; height:72px; object-fit:contain; background:#fff; border-radius:10px; display:block; }
  .grid3 .tile img, .grid3 .tile svg.pic { width:100%; height:96px; }
  .tile .sub { font-size:13px; font-weight:400; color:var(--mute); }
  .tile:active, .row:active, .btn:active, .key:active { filter:brightness(.93); }
  .sec { font-size:14px; font-weight:700; color:var(--mute); margin:18px 4px 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:10px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; min-height:60px; }
  .row .mid { flex:1; min-width:0; }
  .row .t1 { font-weight:700; font-size:17px; overflow-wrap:anywhere; }
  .row .t2 { font-size:14px; color:var(--mute); overflow-wrap:anywhere; }
  .row .rt { text-align:right; flex:none; }
  .row .ic { font-size:26px; flex:none; width:34px; text-align:center; }
  .row.sel { border:2px solid var(--go); background:#eaf7ef; }
  .num { font-variant-numeric:tabular-nums; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .chip { display:inline-block; font-size:13px; font-weight:700; border-radius:10px; padding:2px 8px; background:var(--soft); color:var(--brand); }
  .chip.g { background:#e3f5ea; color:var(--go); } .chip.r { background:#fde8e6; color:var(--bad); } .chip.a { background:#fff0d9; color:var(--warn); } .chip.x { background:#eceff2; color:var(--mute); }
  .btn { display:block; width:100%; min-height:58px; border-radius:14px; font-size:19px; font-weight:700; text-align:center; padding:12px; background:var(--brand); color:#fff; }
  .btn.go { background:var(--go); } .btn.bad { background:var(--bad); } .btn.ghost { background:var(--card); color:var(--brand); border:2px solid var(--brand); }
  .btn.slim { min-height:44px; font-size:16px; padding:8px; }
  .btn[disabled] { background:#b8c0c9; color:#fff; border-color:#b8c0c9; }
  .foot { position:fixed; left:0; right:0; bottom:0; z-index:6; background:rgba(242,244,247,.97); border-top:1px solid var(--line); padding:10px 12px; }
  .foot .in { max-width:536px; margin:0 auto; display:flex; gap:10px; }
  .big { font-size:34px; font-weight:800; }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px dashed var(--line); }
  .kv:last-child { border-bottom:0; }
  .kv b { font-weight:700; }
  .field { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; background:var(--card); border:2px solid var(--line); border-radius:12px; padding:12px; min-height:60px; margin-bottom:8px; }
  .field .lab { color:var(--mute); font-size:15px; } .field .val { font-size:20px; font-weight:800; text-align:right; overflow-wrap:anywhere; }
  .field.need { border-color:var(--warn); }
  .txt { width:100%; border:2px solid var(--line); border-radius:12px; padding:12px; min-height:56px; background:#fff; font-size:18px; }
  .msg { border-radius:12px; padding:12px; margin-bottom:10px; font-weight:700; }
  .msg.bad { background:#fde8e6; color:var(--bad); } .msg.ok { background:#e3f5ea; color:var(--go); } .msg.warn { background:#fff0d9; color:var(--warn); } .msg.info { background:var(--soft); color:var(--brand); }
  .center { text-align:center; }
  .mut { color:var(--mute); } .sm { font-size:14px; }
  .del { width:40px; height:40px; border-radius:20px; background:#fde8e6; color:var(--bad); font-size:22px; text-align:center; flex:none; }
  #modal { position:fixed; inset:0; z-index:20; background:rgba(10,20,30,.55); display:none; align-items:flex-end; justify-content:center; }
  #modal.show { display:flex; }
  #modal .sheet { background:#fff; width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:14px 14px 18px; max-height:94vh; overflow:auto; }
  .disp { font-size:34px; font-weight:800; text-align:right; padding:10px 12px; border:2px solid var(--line); border-radius:12px; min-height:64px; margin:8px 0 10px; overflow-wrap:anywhere; }
  .keys { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .key { min-height:58px; border-radius:12px; background:var(--soft); font-size:28px; font-weight:800; text-align:center; color:var(--ink); }
  .pins { display:flex; justify-content:center; gap:14px; margin:14px 0; min-height:24px; }
  .pins i { width:18px; height:18px; border-radius:9px; background:var(--line); display:block; } .pins i.f { background:var(--brand); }
  #toast { position:fixed; left:50%; top:66px; transform:translateX(-50%); z-index:30; background:#16202b; color:#fff; padding:10px 16px; border-radius:22px; font-weight:700; display:none; max-width:90%; text-align:center; }
  #wait { position:fixed; inset:0; z-index:40; background:rgba(255,255,255,.86); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; font-size:20px; font-weight:700; }
  #wait.show { display:flex; }
  .spin { width:54px; height:54px; border-radius:27px; border:6px solid var(--line); border-top-color:var(--brand); animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .avatar { width:54px; height:54px; border-radius:27px; background:var(--brand); color:#fff; font-size:26px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }
  .strike { text-decoration:line-through; color:var(--mute); }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  .stat .l { font-size:13px; color:var(--mute); font-weight:700; } .stat .v { font-size:22px; font-weight:800; } .stat .s { font-size:12px; color:var(--mute); }
  .stat.pos .v { color:var(--go); } .stat.neg .v { color:var(--bad); }
  .light { display:inline-block; width:14px; height:14px; border-radius:7px; vertical-align:middle; margin-right:6px; }
  .light.green { background:#16a34a; } .light.amber { background:#f59e0b; } .light.red { background:#dc2626; }
  table.t { width:100%; border-collapse:collapse; background:#fff; font-size:14px; }
  table.t th, table.t td { padding:6px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  table.t th { background:var(--soft); font-size:13px; position:sticky; top:56px; }
  table.t td.r, table.t th.r { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tw { overflow-x:auto; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; }
  .doc { background:#fff; color:#000; border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:12px; font-size:15px; }
  @media screen { .doc { overflow-x:auto; } }   /* a wide report scrolls inside its paper, the page itself never slides sideways */
  @media screen and (max-width:380px) { .doc { padding:10px; } .doc td, .doc th { padding-left:3px !important; padding-right:3px !important; } }
  .doc h1 { font-size:21px; margin:0; text-align:center; } .doc h2 { font-size:17px; margin:10px 0 6px; text-align:center; border-top:2px solid #000; border-bottom:2px solid #000; padding:4px 0; }
  .doc .c { text-align:center; font-size:13px; } .doc .p { font-size:13px; margin:6px 0; }
  .doc table { width:100%; border-collapse:collapse; margin:6px 0; } .doc td, .doc th { padding:4px 3px; border-bottom:1px solid #bbb; vertical-align:top; font-size:14px; } .doc th { border-bottom:2px solid #000; text-align:left; }
  .doc .r { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; } .doc .b { font-weight:800; }
  .doc .kv2 { display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:2px 0; } .doc .kv2 span:last-child { text-align:right; font-weight:700; }
  .doc .sign { display:flex; justify-content:space-between; gap:20px; margin-top:44px; } .doc .sign div { flex:1; border-top:1px solid #000; text-align:center; font-size:13px; padding-top:4px; }
  .doc .stamp { border:2px solid #b42318; color:#b42318; font-weight:800; text-align:center; padding:4px; margin:6px 0; }
  .seg { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; } .seg button { flex:1; min-height:44px; border-radius:10px; border:2px solid var(--line); background:#fff; font-weight:700; text-align:center; padding:4px 8px; } .seg button.on { border-color:var(--go); background:#eaf7ef; }
  @media print {
    @page { margin:10mm; }
    html, body { background:#fff !important; }
    .bar, .foot, .noprint, #toast, #wait, #modal { display:none !important; }
    #app { max-width:none; padding:0; } .pad { padding:0; }
    .doc { border:0; padding:0; margin:0; }
    table.t th { position:static; }
    body.roll .doc { width:72mm; font-size:11px; } body.roll .doc td, body.roll .doc th, body.roll .doc .kv2 { font-size:11px; } body.roll .doc h1 { font-size:15px; } body.roll .doc h2 { font-size:13px; }
  }
</style>

    var t = S.meta.methods[m];

function valueOf(qty, per, rate) {

  // integer arithmetic: base * paisa can pass 2^53 for large lines, so split

    if (S.user.role === 'owner') add(box, btn('btn', L('🔎 এখনই পুরো খাতা যাচাই'), function () { fetchData({ fn: 'verify' }, L('পুরো খাতা যাচাই হচ্ছে…')).then(function (v) { S.lastCheck = { at: v.at, ok: v.ok }; alertBox(v.ok ? L('খাতা ঠিক আছে: ') + v.rows + L(' লাইন, ') + v.entries + L(' এন্ট্রি। হিসাবে কোনো গরমিল নেই, সব এন্ট্রি ঠিক আছে।') : L('সমস্যা: ') + v.problems.join(' / '), v.ok ? 'ok' : 'bad').then(draw); }); }));
  });
}

/* ---------- start ---------- */
function onTouch(ev) {
  if (isIdle()) { lockNow(IDLE_NOTE, true); if (ev && ev.type === 'click') { ev.stopPropagation(); ev.preventDefault(); } return; }
  var was = lastTouch; lastTouch = Date.now();
  if (S.token && lastTouch - was > 60000) saveSession();   // the kept login remembers the last use (at most once a minute)
}
document.addEventListener('touchstart', onTouch, { capture: true, passive: true });
document.addEventListener('click', onTouch, true);
document.addEventListener('visibilitychange', function () { if (!document.hidden && isIdle()) lockNow(IDLE_NOTE, true); });
setInterval(function () { if (isIdle()) lockNow(IDLE_NOTE, true); }, 15000);
S.dev = lsGet(LS_DEVICE);
loadPending();
function showReload() {
  closeModal(); wait(false);
  stack = [function () { var body = frame(L('আল আমিন ট্রেডার্স'), { noUser: true }); add(body, el('div', 'msg bad', ERR.OLD_PAGE), el('div', 'mut sm', L('যেসব এন্ট্রি ফোনে জমা আছে সেগুলো মুছবে না; পাতা আবার খুলে পিন দিলে খাতায় উঠবে।')), btn('btn', L('🔄 পাতা আবার খুলুন'), function () { location.reload(); })); }];
  draw();
}
function boot() {
  api({ fn: 'boot' }).then(function (b) { S.boot = b; if (b && b.business) b.business = L(b.business); if (b.version !== PAGE_VERSION) { showReload(); return; } if (!S.token) showLogin(); else afterLogin(); }, function (e) {
    if (e.code === 'DEVICE') { showEnroll(); return; }
    stack = [function () { var body = frame(L('আল আমিন ট্রেডার্স'), { noUser: true }); add(body, el('div', 'msg bad', errText(e)), btn('btn', L('🔄 আবার চেষ্টা'), function () { showLogin(); boot(); })); }]; draw();
  });
}
if (typeof S.dev === 'string' && S.dev) { if (!restoreSession()) showLogin(); else { stack = [function () { frame(L('আল আমিন ট্রেডার্স'), { noUser: true }); }]; draw(); } boot(); } else showEnroll();
})();
</script>
