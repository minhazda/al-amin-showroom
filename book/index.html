function onTouch(ev) {
  if (isIdle()) { lockNow(IDLE_NOTE, true); if (ev && ev.type === 'click') { ev.stopPropagation(); ev.preventDefault(); } return; }
  var was = lastTouch; lastTouch = Date.now();
  if (S.token && lastTouch - was > 60000) saveSession();   // the kept login remembers the last use (at most once a minute)
}
document.addEventListener('touchstart', onTouch, { capture: true, passive: true });
document.addEventListener('click', onTouch, true);
document.addEventListener('visibilitychange', function () { if (!document.hidden && isIdle()) lockNow(IDLE_NOTE, true); });
setInterval(function () { if (isIdle()) lockNow(IDLE_NOTE, true); }, 15000);
S.dev = lsGet(LS_DEVICE);
loadPending();
function showReload() {
  closeModal(); wait(false);
  stack = [function () { var body = frame('আল আমিন ট্রেডার্স', { noUser: true }); add(body, el('div', 'msg bad', ERR.OLD_PAGE), el('div', 'mut sm', 'যেসব এন্ট্রি ফোনে জমা আছে সেগুলো মুছবে না; পাতা আবার খুলে পিন দিলে খাতায় উঠবে।'), btn('btn', '🔄 পাতা আবার খুলুন', function () { location.reload(); })); }];
  draw();
}
function boot() {
  api({ fn: 'boot' }).then(function (b) { S.boot = b; if (b.version !== PAGE_VERSION) { showReload(); return; } if (!S.token) showLogin(); else afterLogin(); }, function (e) {
    if (e.code === 'DEVICE') { showEnroll(); return; }
    stack = [function () { var body = frame('আল আমিন ট্রেডার্স', { noUser: true }); add(body, el('div', 'msg bad', errText(e)), btn('btn', '🔄 আবার চেষ্টা', function () { showLogin(); boot(); })); }]; draw();
  });
}
if (typeof S.dev === 'string' && S.dev) { if (!restoreSession()) showLogin(); else { stack = [function () { frame('আল আমিন ট্রেডার্স', { noUser: true }); }]; draw(); } boot(); } else showEnroll();
})();
</script>
