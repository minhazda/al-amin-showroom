  .bar .who { font-size:14px; background:rgba(255,255,255,.16); border-radius:16px; padding:6px 10px; flex:none; max-width:40%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pad { padding:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 8px; min-height:104px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; font-weight:700; }
  .tile .ic { font-size:38px; line-height:1; }
  .tile.sm { min-height:76px; padding:10px 6px; font-size:16px; }

  .tile.warn { border-color:var(--warn); background:#fff7ed; }

  .sec { font-size:14px; font-weight:700; color:var(--mute); margin:18px 4px 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:10px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; min-height:60px; }
  .row .mid { flex:1; min-width:0; }
  .row .t1 { font-weight:700; font-size:17px; overflow-wrap:anywhere; }
  .row .t2 { font-size:14px; color:var(--mute); overflow-wrap:anywhere; }
  .row .rt { text-align:right; flex:none; }
  .row .ic { font-size:26px; flex:none; width:34px; text-align:center; }
  .num { font-variant-numeric:tabular-nums; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .chip { display:inline-block; font-size:13px; font-weight:700; border-radius:10px; padding:2px 8px; background:var(--soft); color:var(--brand); }

  .btn[disabled] { background:#b8c0c9; color:#fff; border-color:#b8c0c9; }
  .foot { position:fixed; left:0; right:0; bottom:0; z-index:6; background:rgba(242,244,247,.97); border-top:1px solid var(--line); padding:10px 12px; }

  .big { font-size:34px; font-weight:800; }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px dashed var(--line); }
  .kv:last-child { border-bottom:0; }
  .kv b { font-weight:700; }

  .field.need { border-color:var(--warn); }
  .txt { width:100%; border:2px solid var(--line); border-radius:12px; padding:12px; min-height:56px; background:#fff; font-size:18px; }

  #wait { position:fixed; inset:0; z-index:40; background:rgba(255,255,255,.86); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; font-size:20px; font-weight:700; }

  }
</style>

/** Big number pad. opts: title, value, max, digits (keep as text, e.g. a phone number), len, hint. Resolves null if cancelled. */
function askNumber(opts) {
  return new Promise(function (res) {
    var asText = !!opts.digits;
    var cur = (opts.value === undefined || opts.value === null || (!asText && !opts.value)) ? '' : String(opts.value);
    var fresh = !asText && cur !== '';     // a figure already shown is replaced by the first key, never added to
    var maxLen = opts.len || (asText ? 14 : 9);
    openModal(function (s) {
      var disp = el('div', 'disp num');
      var hint = el('div', 'mut sm', opts.hint || '');
      function paint() { disp.textContent = asText ? (cur || ' ') : (opts.plain ? (cur || '0') : tk(Number(cur || 0))); disp.style.color = fresh ? '#8a96a3' : ''; }
      function press(k) {
        if (k === 'del') { cur = fresh ? '' : cur.slice(0, -1); fresh = false; paint(); return; }
        var nxt = (fresh ? '' : cur) + k;
        if (!asText) nxt = nxt.replace(/^0+(?=\d)/, '');
        if (nxt.length > maxLen || (!asText && opts.max !== undefined && Number(nxt) > opts.max)) {
          // a key that would go over the limit is refused; the figure on screen is never changed into something else
          hint.textContent = asText ? 'আর সংখ্যা হবে না' : 'এর বেশি হবে না: ' + (opts.plain ? opts.max : tk(opts.max)); hint.className = 'msg bad';
          return;
        }
        cur = nxt; fresh = false; hint.textContent = opts.hint || ''; hint.className = 'mut sm'; paint();
      }
      var keys = el('div', 'keys');
      ['1', '2', '3', '4', '5', '6', '7', '8', '9', asText ? '' : '00', '0', 'del'].forEach(function (k) {
        if (k === '') { add(keys, el('div')); return; }
        add(keys, btn('key num', k === 'del' ? '⌫' : k, function () { press(k); }));
      });
      var g = el('div', 'grid'); g.style.marginTop = '10px';
      add(g, btn('btn ghost', 'বাতিল', function () { closeModal(); res(null); }),
        btn('btn go', 'ঠিক আছে', function () { closeModal(); res(asText ? cur : Number(cur || 0)); }));
      add(s, el('div', 'sec', opts.title || ''), disp, hint, keys, g);
      paint();
    });
  });
}
function askText(opts) {
  return new Promise(function (res) {
    openModal(function (s) {
      var inp = el('input', 'txt'); inp.type = 'text'; inp.value = opts.value || ''; inp.maxLength = opts.max || 60; inp.placeholder = opts.placeholder || '';

}

/* ---------- items ---------- */
function indexItems(rows) {
  S.items = (rows || []).map(function (r) { return { ref: r[0], brand: r[1], series: r[2], code: r[3], desc: r[4], size: r[5], kind: r[6], setRef: r[7], list: r[8], active: r[9] !== 0 }; });
  S.byRef = {}; S.sets = {};
  S.items.forEach(function (it) { S.byRef[it.ref] = it; if (it.setRef) (S.sets[it.setRef] = S.sets[it.setRef] || []).push(it); });
}
/** The list kept on the phone is used only if its digest equals the book's own; a changed copy is replaced. */
function loadItems() {
  var cached = lsGet(LS_ITEMS);
  if (!Array.isArray(cached)) cached = null;
  return (cached ? sha256Hex(JSON.stringify(cached)) : Promise.resolve(null)).then(function (digest) {
    return authed({ fn: 'items', have: digest }).then(function (r) {
      if (r.items) { indexItems(r.items); lsSet(LS_ITEMS, r.items); } else indexItems(cached);
      S.stock = r.stock || {};
    });
  });
}
function forCart() { return S.items.filter(function (it) { return it.active || (cart && cart.kind !== 'sale' && cart.kind !== 'estimate'); }); }
function itemTitle(it) { return it.code ? it.code + (it.size ? '  ' + it.size : '') : it.desc; }
function itemSub(it) { var a = []; if (it.code && it.desc) a.push(it.desc); if (!it.code && it.size) a.push(it.size); if (it.kind && it.kind !== 'Single') a.push(it.kind === 'Set of 2 pieces' ? 'সেট (২ পিস)' : it.kind.replace('Piece', 'পিস')); return a.join(' · '); }
function isSet(it) { return it.kind === 'Set of 2 pieces'; }

/* ---------- picking items ---------- */
var cart = null;   // { kind, lines:[{ref,text,sub,list,qty,rate,serial,dir}], supplier }
var CART_CFG = {
  sale: { title: 'বিক্রি', rate: true, next: 'টাকা নিন' },
  stockIn: { title: 'মাল এলো', rate: false, next: 'সেভ করুন' },
  saleReturn: { title: 'মাল ফেরত', rate: true, next: 'টাকা ফেরত' },
  stockAdj: { title: 'স্টক ঠিক করা', rate: false, dir: true, next: 'কারণ লিখুন' },
  estimate: { title: 'দাম হিসাব', rate: true, next: '' }
};
function cartLine(p, qty, rate, serial) {
  return { ref: p.ref, text: (BRAND_BN[p.brand] || p.brand) + ' ' + itemTitle(p), sub: itemSub(p), list: p.list, qty: qty, rate: rate, serial: serial || '', dir: 'out' };
}
function startCart(kind, supplier, brand) {
  cart = { kind: kind, lines: [], supplier: supplier || '', discount: 0 };
  browse = { brand: brand || null, series: null, q: '', lockBrand: false };
  if (kind === 'sale') {
    var d = lsGet(draftKey());
    if (d && d.user === S.user.id && Array.isArray(d.lines) && d.lines.length) {
      // only the reference, quantity, rate and serial are taken from the draft; the words and list price come from the item list
      var whole = function (v, min, max) { return (typeof v === 'number' && isFinite(v) && Math.floor(v) === v && v >= min && v <= max) ? v : min; };
      d.lines.forEach(function (l) {
        if (!l || typeof l !== 'object') return;
        if (l.ref === 'OTHER') { if (typeof l.text === 'string' && l.text) cart.lines.push({ ref: 'OTHER', text: l.text.substring(0, 100), sub: 'তালিকার বাইরে', list: null, qty: whole(l.qty, 1, 9999), rate: whole(l.rate, 0, 10000000), serial: '', dir: 'out' }); return; }
        var it = S.byRef[l.ref];
        if (it && it.active && !isSet(it)) cart.lines.push(cartLine(it, whole(l.qty, 1, 9999), whole(l.rate, 0, 10000000), typeof l.serial === 'string' ? l.serial.substring(0, 40) : ''));
      });
      cart.discount = whole(d.discount, 0, 100000000);
    }
  }

function methodsFor(dir, only) {

/**
 * A plain calculator. Figures are held as whole hundredths (so 0.1 + 0.2 is exactly 0.3);
 * a division is rounded to two decimals. Kept as a pure function so it can be tested on its own.
 * state: { acc: hundredths or null, op: '+', '-', '*', '/' or null, cur: typed text, err: bool }
 */
function calcKey(st, k) {
  var LIMIT = 9000000000000000;                          // beyond this a figure could no longer be exact, so the calculator stops
  var toH = function (t) { var m = /^(\d*)(?:\.(\d{0,2}))?$/.exec(t || '0'); return Number(m[1] || 0) * 100 + Number(((m[2] || '') + '00').substring(0, 2)); };
  var toText = function (h) { var a = Math.abs(h), w = Math.floor(a / 100), f = a % 100; return (h < 0 ? '-' : '') + w + (f ? '.' + (f < 10 ? '0' : '') + f : ''); };
  var divRound = function (num, den) {                   // whole-number division, halves rounded away from zero
    if (den === 0 || Math.abs(num) > LIMIT) return null;
    var neg = (num < 0) !== (den < 0); num = Math.abs(num); den = Math.abs(den);
    var q = Math.floor(num / den), rem = num - q * den;
    if (rem * 2 >= den) q += 1;
    return neg ? -q : q;
  };
  var apply = function (a, op, b) {
    if (op === '+') return a + b;
    if (op === '-') return a - b;
    if (op === '*') return divRound(a * b, 100);
    if (op === '/') return b === 0 ? null : divRound(a * 100, b);
    return b;
  };
  var bad = { acc: null, op: null, cur: '', err: true };
  if (st.err && k !== 'C') return st;
  if (k === 'C') return { acc: null, op: null, cur: '', err: false };
  var n = { acc: st.acc, op: st.op, cur: st.cur, err: false };
  if (k === 'del') { n.cur = n.cur.slice(0, -1); return n; }
  if (/^\d$/.test(k) || k === '00') {
    if (n.cur.charAt(0) === '-') return n;               // a worked-out figure is not typed onto
    if (n.cur.indexOf('.') >= 0 && n.cur.split('.')[1].length + k.length > 2) return n;
    if (n.cur.replace('.', '').length + k.length > 11) return n;
    n.cur = (n.cur === '0' ? '' : n.cur) + k; if (/^0+$/.test(n.cur)) n.cur = '0';
    return n;
  }
  if (k === '.') { if (n.cur.charAt(0) !== '-' && n.cur.indexOf('.') < 0) n.cur = (n.cur || '0') + '.'; return n; }
  if (k === '%') {
    if (n.cur === '' || n.cur.charAt(0) === '-') return n;
    var pc = toH(n.cur), v;
    if (n.acc !== null && (n.op === '+' || n.op === '-')) v = divRound(n.acc * pc, 10000);      // 4800 - 15 %  ->  720 is taken off
    else if (n.acc !== null && n.op === '*') { v = divRound(n.acc * pc, 10000); if (v === null) return bad; return { acc: v, op: null, cur: '', err: false }; }   // 4800 x 15 %  ->  720
    else if (n.acc !== null && n.op === '/') { v = divRound(n.acc * 10000, pc); if (v === null) return bad; return { acc: v, op: null, cur: '', err: false }; }
    else v = divRound(pc, 100);
    if (v === null) return bad;
    n.cur = toText(v);
    return n;
  }
  if (k === '+' || k === '-' || k === '*' || k === '/' || k === '=') {
    if (n.cur !== '') {
      var b = n.cur.charAt(0) === '-' ? -toH(n.cur.substring(1)) : toH(n.cur);
      var r = (n.acc === null || n.op === null) ? b : apply(n.acc, n.op, b);
      if (r === null || Math.abs(r) > 99999999999999) return bad;
      n.acc = r; n.cur = '';

    return n;
  }
  return n;
}
function calcShow(st) {

  var fmt = function (h) { var neg = h < 0; h = Math.abs(h); var whole = Math.floor(h / 100), frac = h % 100; return (neg ? '-' : '') + whole.toLocaleString('en-IN') + (frac ? '.' + (frac < 10 ? '0' : '') + frac : ''); };
  if (st.cur !== '') { var neg = st.cur.charAt(0) === '-', p2 = (neg ? st.cur.substring(1) : st.cur).split('.'); return (neg ? '-' : '') + Number(p2[0] || 0).toLocaleString('en-IN') + (p2.length > 1 ? '.' + p2[1] : ''); }

          var rt = el('div', 'rt'); add(rt, el('div', 't1 num', tk(x.gross - x.discount)), x.discount ? el('div', 'sm num', 'ছাড় ' + tk(x.discount)) : null);
          var wr = btn('row', null, function () { push(function () { screenDoc(x.txn); }); });
          add(box, add(wr, add(el('div', 'mid'), el('div', 't1', (x.bill || x.txn) + ' · ' + x.by + ' · ' + dmy(x.date)), el('div', 't2', why), x.rate !== null ? el('div', 't2', x.text + ' — ' + tk(x.rate) + ' (তালিকা ' + tk(x.list) + ')') : el('div', 't2', x.text)), rt));

        d.nonCash.forEach(function (x) { var nr = btn('row', null, function () { push(function () { screenDoc(x.txn); }); }); add(box, add(nr, add(el('div', 'mid'), el('div', 't1', (PLACE[x.place] || { ic: '' }).ic + ' ' + x.txn + ' · ' + x.by + ' · ' + dmy(x.date)), el('div', 't2', payText({ method: x.method, acct: x.acct, bank: x.bank, ref: x.ref, account: x.place }))), el('div', 't1 num', tk(x.amount)))); });

/* ---------- searching entries; the checker's lists ---------- */
var recentQ = '';
function entryList(title, filter, intro) {
  var body = frame(title);
  if (intro) add(body, el('div', 'msg info', intro));
  var inp = el('input', 'txt'); inp.type = 'search'; inp.placeholder = '🔍 এন্ট্রি / বিল / চালান / চেক নম্বর, মোবাইল বা নাম'; inp.value = filter ? '' : recentQ; inp.setAttribute('autocomplete', 'off');
  var box = el('div'), moreBox = el('div'); box.style.marginTop = '10px';
  add(body, inp, box, moreBox);
  var lowest = null, token = 0, q = inp.value;
  function load(reset) {
    var mine = ++token;
    if (reset) { clear(box); lowest = null; }
    clear(moreBox); add(moreBox, el('div', 'mut center', 'আনছে…'));
    var req = { fn: 'recent', q: q };
    if (filter) req.filter = filter;
    if (lowest !== null) req.before = lowest;
    authed(req).then(function (d) {
      if (mine !== token) return;
      clear(moreBox);
      d.entries.forEach(function (e) { add(box, entryRow(e, openDoc)); lowest = Number(e.txn.substring(1)); });
      if (!d.entries.length && !box.firstChild) add(box, el('div', 'mut center', filter === 'unchecked' ? 'সব এন্ট্রি যাচাই হয়েছে' : 'কিছু পাওয়া যায়নি'));
      if (d.more) add(moreBox, btn('btn ghost', 'আরও পুরোনো এন্ট্রি দেখুন', function () { load(false); }));
    }, function (e) { if (mine === token && e.code !== 'AUTH' && e.code !== 'DEVICE') { clear(moreBox); add(moreBox, el('div', 'msg bad', errText(e))); } });
  }
  var t = null;
  inp.addEventListener('input', function () { q = inp.value; if (!filter) recentQ = q; clearTimeout(t); t = setTimeout(function () { load(true); }, 400); });
  load(true);
}
function screenRecent() { entryList(S.user.role === 'owner' ? 'এন্ট্রি দেখা / বাতিল' : 'সব এন্ট্রি', null, S.user.role === 'owner' ? 'এন্ট্রি চাপলে মেমো দেখা যায়, সেখান থেকে বাতিল করা যায়। এন্ট্রি মোছা যায় না: বাতিল করলে উল্টো এন্ট্রি লেখা হয়, দুটোই খাতায় থাকে।' : null); }

function screenQueries() { entryList('খোলা প্রশ্ন', 'queries', S.user.role === 'owner' ? 'যেসব এন্ট্রি নিয়ে প্রশ্ন উঠেছে। চেপে দেখে উত্তর দিন, দরকার হলে বাতিল করে ঠিক এন্ট্রি দিন।' : 'যেসব প্রশ্নের উত্তর মালিক এখনো দেননি।'); }
function reverseEntry(e) {

  openModal(function (s) {

/* ---------- start ---------- */
// The idle test runs before anything else on every touch, so a touch after a long gap locks the page instead of waking it.
function onTouch(ev) {
  if (isIdle()) { lockNow(IDLE_NOTE, true); if (ev && ev.type === 'click') { ev.stopPropagation(); ev.preventDefault(); } return; }
  lastTouch = Date.now();
}
document.addEventListener('touchstart', onTouch, { capture: true, passive: true });
document.addEventListener('click', onTouch, true);
document.addEventListener('visibilitychange', function () { if (!document.hidden && isIdle()) lockNow(IDLE_NOTE, true); });
setInterval(function () { if (isIdle()) lockNow(IDLE_NOTE, true); }, 15000);

S.dev = lsGet(LS_DEVICE);
loadPending();
function showReload() {
  closeModal(); wait(false);
  stack = [function () { var body = frame('আল আমিন শোরুম', { noUser: true }); add(body, el('div', 'msg bad', ERR.OLD_PAGE), el('div', 'mut sm', 'যেসব এন্ট্রি ফোনে জমা আছে সেগুলো মুছবে না; পাতা আবার খুলে পিন দিলে খাতায় উঠবে।'), btn('btn', '🔄 পাতা আবার খুলুন', function () { location.reload(); })); }];
  draw();
}
function boot() {
  api({ fn: 'boot' }).then(function (b) { S.boot = b; if (b.version !== PAGE_VERSION) { showReload(); return; } if (!S.token) showLogin(); }, function (e) {
    if (e.code === 'DEVICE') { showEnroll(); return; }
    stack = [function () { var body = frame('আল আমিন শোরুম', { noUser: true }); add(body, el('div', 'msg bad', errText(e)), btn('btn', '🔄 আবার চেষ্টা', function () { showLogin(); boot(); })); }]; draw();
  });
}
if (typeof S.dev === 'string' && S.dev) { showLogin(); boot(); } else showEnroll();
})();
